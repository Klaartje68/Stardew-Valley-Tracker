<style>
  :root {
    --cream: #fdf6e3;
    --parchment: #f0e6c8;
    --brown-dark: #3d2b1f;
    --brown-mid: #6b4226;
    --brown-light: #a0673a;
    --green-dark: #2d6a2d;
    --green-mid: #4a9e4a;
    --gold: #d4a017;
    --red: #c0392b;
    --blue: #2471a3;
    --pixel-border: 3px solid var(--brown-dark);
    --shadow: 4px 4px 0px var(--brown-dark);
    --spring-bg: #d4edda; --spring-accent: #2d8a4a; --spring-dark: #1a5c2e;
    --summer-bg: #fff3cd; --summer-accent: #e07b00; --summer-dark: #a05500;
    --fall-bg:   #ffe5cc; --fall-accent:   #b85c00; --fall-dark:   #7a3a00;
    --winter-bg: #d6eaf8; --winter-accent: #1a6fa0; --winter-dark: #0d4d73;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #1a3a1a;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(0,0,0,0.05) 31px, rgba(0,0,0,0.05) 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(0,0,0,0.05) 31px, rgba(0,0,0,0.05) 32px);
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    color: var(--brown-dark);
    padding: 24px 16px 60px;
  }

  /* Header */
  .header { text-align: center; margin-bottom: 20px; }
  .header-box {
    display: inline-block; background: var(--cream);
    border: var(--pixel-border); box-shadow: var(--shadow);
    padding: 16px 36px 14px; position: relative;
  }
  .header-box::before, .header-box::after {
    content: '⭐'; font-size: 18px; position: absolute; top: 50%; transform: translateY(-50%);
  }
  .header-box::before { left: 10px; }
  .header-box::after  { right: 10px; }
  .header-title { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--brown-dark); line-height: 1.8; letter-spacing: 1px; }
  .header-sub { font-size: 13px; color: var(--brown-mid); margin-top: 6px; font-weight: 600; }

  /* View switcher */
  .view-switcher-wrap { max-width: 860px; margin: 0 auto 20px; display: flex; justify-content: center; }
  .view-switcher { display: flex; border: var(--pixel-border); box-shadow: var(--shadow); }
  .view-btn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 1px;
    padding: 16px 24px; cursor: pointer; border: none; outline: none;
    background: var(--parchment); color: var(--brown-mid);
    border-right: 3px solid var(--brown-dark); transition: background 0.15s;
  }
  .view-btn:last-child { border-right: none; }
  .view-btn.active { background: var(--brown-dark); color: var(--cream); }
  .view-btn:hover:not(.active) { background: var(--cream); }

  /* Progress */
  .overall-progress {
    max-width: 860px; margin: 0 auto 16px;
    background: var(--parchment); border: var(--pixel-border); box-shadow: var(--shadow);
    padding: 14px 20px; display: flex; align-items: center; gap: 16px;
  }
  .overall-label { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--brown-dark); white-space: nowrap; }
  .progress-bar-wrap { flex: 1; height: 20px; background: var(--cream); border: 2px solid var(--brown-dark); overflow: hidden; }
  .progress-bar-fill {
    height: 100%;
    background: repeating-linear-gradient(45deg, var(--green-mid), var(--green-mid) 6px, var(--green-dark) 6px, var(--green-dark) 12px);
    transition: width 0.4s ease;
  }
  .progress-pct { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--brown-dark); white-space: nowrap; min-width: 40px; text-align: right; }

  .btn-row { max-width: 860px; margin: 0 auto 24px; display: flex; justify-content: flex-end; }
  .btn-reset {
    background: var(--red); color: #fff; border: 3px solid var(--brown-dark);
    box-shadow: 3px 3px 0 var(--brown-dark); font-family: 'Press Start 2P', monospace;
    font-size: 7px; padding: 8px 14px; cursor: pointer; letter-spacing: 1px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-reset:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--brown-dark); }

  /* ── TRACKER ── */
  #trackerView { display: block; }
  #plannerView { display: none; }

  .rooms-grid {
    max-width: 860px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px;
  }
  .room { background: var(--cream); border: var(--pixel-border); box-shadow: var(--shadow); overflow: hidden; }
  .room-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--brown-dark); }
  .room-title { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--cream); letter-spacing: 0.5px; }
  .room-count { font-family: 'Press Start 2P', monospace; font-size: 7px; color: var(--cream); opacity: 0.85; }
  .room.complete .room-header { outline: 3px solid var(--gold); outline-offset: -3px; }
  .room[data-room="crafts"]   .room-header { background: var(--brown-mid); }
  .room[data-room="pantry"]   .room-header { background: var(--green-dark); }
  .room[data-room="fish"]     .room-header { background: var(--blue); }
  .room[data-room="boiler"]   .room-header { background: #555; }
  .room[data-room="bulletin"] .room-header { background: #8B4513; }
  .room[data-room="vault"]    .room-header { background: #7B6914; }

  {id:'pr_keg',          label:'Keg',             category:'crafting', seasons:['yearround'], unlocks:['wine']},
  {id:'pr_preserves_jar',label:'Preserves Jar',   category:'crafting', seasons:['yearround'], unlocks:['jelly']},
  {id:'pr_bee_house',    label:'Bee House',       category:'crafting', seasons:['yearround'], unlocks:['honey']},
  {id:'pr_tapper',       label:'Tapper',          category:'crafting', seasons:['yearround'], unlocks:['maple_syrup','oak_resin','pine_tar','maple_syrup2','oak_resin2']},
  // Special access
  {id:'pr_bus',          label:'Bus Repaired',    category:'access',   seasons:['yearround'], unlocks:['sandfish','coconut','cactus']},
  // Recipes
  {id:'pr_maki_recipe',  label:'Maki Roll Recipe',category:'recipe',   seasons:['yearround'], unlocks:['maki_roll']},
  // Tools
  {id:'pr_copper_axe',      label:'Copper Axe',       cost:2000,  bars:5, barType:'Copper Bar', category:'tool', seasons:['spring'],    unlocks:[]},
  {id:'pr_copper_pickaxe',  label:'Copper Pickaxe',   cost:2000,  bars:5, barType:'Copper Bar', category:'tool', seasons:['spring'],    unlocks:[]},
  {id:'pr_steel_axe',       label:'Steel Axe',        cost:5000,  bars:5, barType:'Iron Bar',   category:'tool', seasons:['summer'],    unlocks:[]},
  {id:'pr_steel_pickaxe',   label:'Steel Pickaxe',    cost:5000,  bars:5, barType:'Iron Bar',   category:'tool', seasons:['summer'],    unlocks:[]},
  {id:'pr_gold_pickaxe',    label:'Gold Pickaxe',     cost:10000, bars:5, barType:'Gold Bar',   category:'tool', seasons:['fall'],      unlocks:[]},
  {id:'pr_iridium_pickaxe', label:'Iridium Pickaxe',  cost:25000, bars:5, barType:'Iridium Bar',category:'tool', seasons:['winter'],    unlocks:[]},
  // Fall trees (need to be planted in advance)
  {id:'pr_apple_tree',   label:'Apple Tree (plant early!)',       cost:4000, category:'building', seasons:['summer'], unlocks:['apple','apple2']},
  {id:'pr_pomegranate_tree', label:'Pomegranate Tree (plant early!)', cost:6000, category:'building', seasons:['summer'], unlocks:['pomegranate','pomegranate2']},
];

// Build lookup: bundle item id → array of prerequisite ids
const ITEM_PREREQS = {};
PREREQUISITES.forEach(p => {
  p.unlocks.forEach(itemId => {
    if(!ITEM_PREREQS[itemId]) ITEM_PREREQS[itemId] = [];
    ITEM_PREREQS[itemId].push(p.id);
  });
});

function prereqsMet(itemId) {
  const prereqs = ITEM_PREREQS[itemId];
  if(!prereqs || prereqs.length === 0) return true;
  return prereqs.every(pid => isChecked(pid));
}

function togglePrereq(id) { state[id]=!state[id]; saveState(); render(); }

const SEASONS_META = [
  {id:'spring',    label:'Spring',     icon:'🌸'},
  {id:'summer',    label:'Summer',     icon:'☀️'},
  {id:'fall',      label:'Fall',       icon:'🍂'},
  {id:'winter',    label:'Winter',     icon:'❄️'},
  {id:'yearround', label:'Year-Round', icon:'🗓️'},
];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ═══════════════ STATE ═══════════════ */
let state = {};
let currentView = 'tracker';
let currentSeason = 'spring'; // default planner tab

function loadState()  { try { state = JSON.parse(localStorage.getItem('sdv_cc_tracker')||'{}'); } catch{state={};} }
function saveState()  { localStorage.setItem('sdv_cc_tracker', JSON.stringify(state)); }
function isChecked(id){ return !!state[id]; }

function toggleItem(id){ state[id]=!state[id]; saveState(); render(); }

function resetAll(){
  if(confirm('Reset ALL progress? This cannot be undone.')){ state={}; saveState(); render(); }
}

/* ═══════════════ VIEW SWITCH ═══════════════ */
function switchView(v){
  currentView=v;
  document.getElementById('trackerView').style.display = v==='tracker'?'block':'none';
  document.getElementById('plannerView').style.display = v==='planner'?'block':'none';
  document.getElementById('btnTracker').classList.toggle('active', v==='tracker');
  document.getElementById('btnPlanner').classList.toggle('active', v==='planner');
  render();
}

function switchSeason(s){
  currentSeason=s;
  document.querySelectorAll('.season-tab').forEach(t=>t.classList.toggle('active',t.dataset.s===s));
  document.querySelectorAll('.season-panel').forEach(p=>p.classList.toggle('active',p.dataset.s===s));
}

/* ═══════════════ COUNTS ═══════════════ */
function countBundle(b){
  const required = b.required || b.items.length;
  const done = Math.min(b.items.filter(i=>isChecked(i.id)).length, required);
  return {done, total:required};
}
function countRoom(r){ let d=0,t=0; r.bundles.forEach(b=>{const c=countBundle(b);d+=c.done;t+=c.total;}); return{done:d,total:t}; }
function countAll(){ let d=0,t=0; ROOMS.forEach(r=>{const c=countRoom(r);d+=c.done;t+=c.total;}); return{done:d,total:t}; }

/* ═══════════════ RENDER TRACKER ═══════════════ */
function renderTracker(){
  const grid=document.getElementById('roomsGrid');
  grid.innerHTML='';
  ROOMS.forEach(room=>{
    const rc=countRoom(room), complete=rc.done===rc.total;
    const el=document.createElement('div');
    el.className='room'+(complete?' complete':'');
    el.dataset.room=room.id;

    let bHtml='';
    room.bundles.forEach(bundle=>{
      const{done,total}=countBundle(bundle);
      const bc=done===total, open=state['_open_'+bundle.id]||false;
      const isPartial = bundle.required && bundle.required < bundle.items.length;
      const chooseHint = isPartial ? `<span style="font-size:10px;color:var(--brown-light);font-style:italic;margin-left:4px;">choose ${bundle.required}</span>` : '';
      let iHtml=bundle.items.map(item=>{
        const chk=isChecked(item.id);
        const ql=item.quality?`<span class="item-quality">★ Gold</span>`:'';
        return `<div class="item-row ${chk?'checked':''}" onclick="toggleItem('${item.id}')">
          <div class="item-checkbox">${chk?'✓':''}</div>
          <span class="item-label">${item.label}</span>${ql}
        </div>`;
      }).join('');
      bHtml+=`<div class="bundle ${bc?'complete':''} ${open?'open':''}" id="bundle_${bundle.id}">
        <div class="bundle-header" onclick="toggleBundle('${bundle.id}')">
          <span class="bundle-emoji">${bundle.emoji}</span>
          <span class="bundle-name">${bundle.name}</span>
          ${chooseHint}
          <span class="bundle-prog">${done}/${total}</span>
          <span class="bundle-star">⭐</span>
          <span class="bundle-toggle">▼</span>
        </div>
        <div class="bundle-items">${iHtml}</div>
      </div>`;
    });

    el.innerHTML=`
      <div class="room-header">
        <span class="room-title">${room.emoji} ${room.name}</span>
        <span class="room-count">${rc.done}/${rc.total}</span>
      </div>
      <div class="bundles">${bHtml}</div>
      <div class="room-complete-banner">✨ ROOM COMPLETE! ✨</div>`;
    grid.appendChild(el);
  });
}

function toggleBundle(id){
  state['_open_'+id]=!state['_open_'+id]; saveState(); renderTracker();
}

function togglePlannerCard(seasonId, cat){
  const key = '_planner_collapsed_'+seasonId+'_'+cat;
  state[key] = !state[key]; saveState(); renderPlanner();
}

/* ═══════════════ RENDER PLANNER ═══════════════ */
const CATEGORY_META = {
  forage:   {label:'Foraging',        icon:'🌿', headerBg:'#2d6a2d'},
  fish:     {label:'Fish',            icon:'🐟', headerBg:'#2471a3'},
  crabpot:  {label:'Crab Pot',        icon:'🦀', headerBg:'#1a7a7a'},
  crop:     {label:'Crops',           icon:'🌱', headerBg:'#7a5c00'},
  animal:   {label:'Animal Products', icon:'🐄', headerBg:'#8B3a5a'},
  artisan:  {label:'Artisan Goods',   icon:'🏺', headerBg:'#7a4a10'},
  mine:     {label:'Mine & Combat',   icon:'⛏️', headerBg:'#555'},
  resource: {label:'Resources',       icon:'🪵', headerBg:'#6b4226'},
  gold:     {label:'Gold',            icon:'💰', headerBg:'#7B6914'},
};
const CATEGORY_ORDER = ['forage','fish','crabpot','crop','animal','artisan','mine','resource','gold'];

function renderPlanner(){
  const tabsEl=document.getElementById('seasonTabs');
  tabsEl.innerHTML=SEASONS_META.map(s=>`
    <button class="season-tab ${s.id===currentSeason?'active':''}" data-s="${s.id}" onclick="switchSeason('${s.id}')">
      ${s.icon} ${s.label.toUpperCase()}
    </button>`).join('');

  const panelsEl=document.getElementById('seasonPanels');
  panelsEl.innerHTML='';

  SEASONS_META.forEach(season=>{
    const panel=document.createElement('div');
    panel.className='season-panel'+(season.id===currentSeason?' active':'');
    panel.dataset.s=season.id;

    const sourceData = season.id==='yearround' ? YEARROUND : SEASONAL.filter(si=>si.season===season.id);
    const needed = sourceData.filter(si=>!isChecked(si.id));

    if(needed.length===0){
      panel.innerHTML=`
        <div class="season-header-bar" data-s="${season.id}">
          <span class="season-icon">${season.icon}</span>
          <span class="season-title" data-s="${season.id}">${season.label}</span>
          <span class="season-needed season-done">✓ Nothing left to collect!</span>
        </div>
        <div class="all-done">🎉 All ${season.label} bundle items collected! 🎉</div>`;
      panelsEl.appendChild(panel);
      return;
    }

    // Group items by category
    const groups={};
    needed.forEach(item=>{
      if(!groups[item.type]) groups[item.type]=[];
      groups[item.type].push(item);
    });

    // Build one card per category, styled like tracker room cards
    const cardsHtml = CATEGORY_ORDER.filter(cat=>groups[cat]).map(cat=>{
      const meta = CATEGORY_META[cat];
      const items = groups[cat];
      const itemsHtml = items.map(item=>{
        const chk = isChecked(item.id);
        const unmet = !prereqsMet(item.id);
        const rainBadge = item.rainOnly ? `<span class="rain-badge">🌧 Rain only</span>` : '';
        const nightBadge = item.nightOnly ? `<span class="night-badge">🌙 Night only</span>` : '';
        const tipAttr = item.tip ? ` title="${item.tip}"` : '';
        return `<div class="item-row ${chk?'checked':''} ${unmet?'prereq-unmet':''}" onclick="toggleItem('${item.id}')"${tipAttr}>
          <div class="item-checkbox">${chk?'✓':unmet?'⚠':''}</div>
          <span class="item-label">${item.label}</span>
          ${rainBadge}
          ${nightBadge}
        </div>`;
      }).join('');

      const collapsed = state['_planner_collapsed_'+season.id+'_'+cat] ? 'collapsed' : '';
      return `<div class="room planner-cat-card ${collapsed}">
        <div class="room-header" style="background:${meta.headerBg}" onclick="togglePlannerCard('${season.id}','${cat}')">
          <span class="room-title">${meta.icon} ${meta.label}</span>
          <span class="planner-card-chevron">▼</span>
        </div>
        <div class="bundles">
          <div class="bundle open" style="background:transparent;border:none;">
            <div class="bundle-items" style="display:flex;padding:4px 2px 6px;">${itemsHtml}</div>
          </div>
        </div>
      </div>`;
    }).join('');

    // Prerequisites section
    const seasonPrereqs = PREREQUISITES.filter(p =>
      (p.seasons.includes(season.id) || p.seasons.includes('all')) &&
      (p.unlocks.length === 0 ? !isChecked(p.id) : p.unlocks.some(itemId => !isChecked(itemId)))
    );

    let prereqHtml = '';
    if(seasonPrereqs.length > 0){
      const pGroups = {};
      seasonPrereqs.forEach(p => {
        if(!pGroups[p.category]) pGroups[p.category] = [];
        pGroups[p.category].push(p);
      });
      const rowsHtml = PREREQ_CATEGORIES.filter(cat => pGroups[cat.id]).map(cat =>
        pGroups[cat.id].map(p => {
          const done = isChecked(p.id);
          const costBadge  = p.cost  ? `<span class="cost-badge">🪙 ${p.cost.toLocaleString()}</span>` : '';
          const woodBadge  = p.wood  ? `<span class="wood-badge">🪵 ${p.wood}</span>` : '';
          const stoneBadge = p.stone ? `<span class="stone-badge">🪨 ${p.stone}</span>` : '';
          const barBadge   = p.bars  ? `<span class="bar-badge">${p.barType === 'Copper Bar' ? '🟤' : p.barType === 'Iron Bar' ? '⬜' : p.barType === 'Gold Bar' ? '🟡' : '🟣'} ×${p.bars}</span>` : '';
          return `<div class="item-row ${done?'checked':''}" onclick="togglePrereq('${p.id}')">
            <div class="item-checkbox">${done?'✓':''}</div>
            <span class="item-label">${p.label}</span>
            <div class="item-badges">${costBadge}${woodBadge}${stoneBadge}${barBadge}</div>
          </div>`;
        }).join('')
      ).join('');

      const prereqCollapsed = state['_planner_collapsed_'+season.id+'_prereq'] ? 'collapsed' : '';
      prereqHtml = `<div class="rooms-grid planner-grid" style="margin-top:0;">
        <div class="room planner-cat-card ${prereqCollapsed}" style="grid-column:1/-1;">
          <div class="room-header" style="background:#4a3520;" onclick="togglePlannerCard('${season.id}','prereq')">
            <span class="room-title">🗝️ Prerequisites</span>
            <span class="room-count" style="font-size:9px;font-family:'Nunito',sans-serif;font-weight:700;opacity:0.8;">Not counted towards completion</span>
            <span class="planner-card-chevron">▼</span>
          </div>
          <div class="bundles"><div class="bundle open" style="background:transparent;border:none;">
            <div class="bundle-items" style="display:flex;padding:4px 2px 6px;">${rowsHtml}</div>
          </div></div>
        </div>
      </div>`;
    }

    panel.innerHTML=`
      <div class="season-header-bar" data-s="${season.id}">
        <span class="season-icon">${season.icon}</span>
        <span class="season-title" data-s="${season.id}">${season.label}</span>
        <span class="season-needed">${needed.length} item${needed.length!==1?'s':''} still needed</span>
      </div>
      <div class="rooms-grid planner-grid">${cardsHtml}</div>
      <div style="max-width:860px;margin:20px auto 0;">${prereqHtml}</div>`;

    panelsEl.appendChild(panel);
  });
}

/* ═══════════════ MAIN RENDER ═══════════════ */
function render(){
  const o=countAll(), pct=o.total?Math.round(o.done/o.total*100):0;
  document.getElementById('overallBar').style.width=pct+'%';
  document.getElementById('overallPct').textContent=pct+'%';
  if(currentView==='tracker') renderTracker();
  else renderPlanner();
}

loadState();
render();
</script>
</body>
</html>
