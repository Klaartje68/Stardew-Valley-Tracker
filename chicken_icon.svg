<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" shape-rendering="crispEdges">
  <!-- Parchment background -->
  <rect width="192" height="192" fill="#f0e6c8"/>

  <!-- Brown pixel border outer -->
  <rect x="0" y="0" width="192" height="24" fill="#3d2b1f"/>
  <rect x="0" y="168" width="192" height="24" fill="#3d2b1f"/>
  <rect x="0" y="0" width="24" height="192" fill="#3d2b1f"/>
  <rect x="168" y="0" width="24" height="192" fill="#3d2b1f"/>
  <!-- Inner border -->
  <rect x="24" y="24" width="144" height="12" fill="#6b4226"/>
  <rect x="24" y="156" width="144" height="12" fill="#6b4226"/>
  <rect x="24" y="24" width="12" height="144" fill="#6b4226"/>
  <rect x="156" y="24" width="12" height="144" fill="#6b4226"/>

  <!-- === CHICKEN === -->
  <!-- Using 12px grid, origin at x=36, y=36 inside border -->

  <!-- COMB (red, top of head) -->
  <rect x="84"  y="36"  width="12" height="12" fill="#c0392b"/>
  <rect x="96"  y="36"  width="12" height="12" fill="#c0392b"/>
  <rect x="108" y="36"  width="12" height="12" fill="#c0392b"/>
  <rect x="96"  y="48"  width="12" height="12" fill="#c0392b"/>

  <!-- WATTLE (red, under beak) -->
  <rect x="108" y="72"  width="12" height="12" fill="#c0392b"/>
  <rect x="108" y="84"  width="12" height="12" fill="#c0392b"/>

  <!-- HEAD (white/cream) -->
  <rect x="72"  y="48"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="84"  y="48"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="96"  y="48"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="72"  y="60"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="84"  y="60"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="96"  y="60"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="108" y="60"  width="12" height="12" fill="#fdf6e3"/>
  <!-- Head shading -->
  <rect x="84"  y="48"  width="6"  height="6"  fill="#ffffff"/>
  <rect x="72"  y="60"  width="6"  height="6"  fill="#ffffff"/>

  <!-- BEAK (orange) -->
  <rect x="120" y="60"  width="12" height="12" fill="#e07b00"/>

  <!-- EYE (dark) -->
  <rect x="96"  y="54"  width="6"  height="6"  fill="#1a1a1a"/>
  <!-- Eye shine -->
  <rect x="99"  y="54"  width="3"  height="3"  fill="#ffffff"/>

  <!-- BODY (white/cream, chunky oval) -->
  <rect x="60"  y="72"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="72"  y="72"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="84"  y="72"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="96"  y="72"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="108" y="72"  width="12" height="12" fill="#fdf6e3"/>

  <rect x="48"  y="84"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="60"  y="84"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="72"  y="84"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="84"  y="84"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="96"  y="84"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="108" y="84"  width="12" height="12" fill="#fdf6e3"/>

  <rect x="48"  y="96"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="60"  y="96"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="72"  y="96"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="84"  y="96"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="96"  y="96"  width="12" height="12" fill="#fdf6e3"/>
  <rect x="108" y="96"  width="12" height="12" fill="#fdf6e3"/>

  <rect x="60"  y="108" width="12" height="12" fill="#fdf6e3"/>
  <rect x="72"  y="108" width="12" height="12" fill="#fdf6e3"/>
  <rect x="84"  y="108" width="12" height="12" fill="#fdf6e3"/>
  <rect x="96"  y="108" width="12" height="12" fill="#fdf6e3"/>

  <!-- Body shading (light grey on shadow side) -->
  <rect x="48"  y="84"  width="6"  height="6"  fill="#e8dfc8"/>
  <rect x="48"  y="96"  width="12" height="6"  fill="#e8dfc8"/>
  <rect x="60"  y="108" width="6"  height="6"  fill="#e8dfc8"/>
  <!-- Body highlight -->
  <rect x="84"  y="72"  width="6"  height="6"  fill="#ffffff"/>
  <rect x="72"  y="84"  width="6"  height="6"  fill="#ffffff"/>

  <!-- TAIL feathers (slightly grey/darker) -->
  <rect x="36"  y="84"  width="12" height="12" fill="#d8cfa8"/>
  <rect x="36"  y="96"  width="12" height="12" fill="#d8cfa8"/>
  <rect x="36"  y="72"  width="12" height="12" fill="#e8dfc8"/>
  <!-- Tail highlight -->
  <rect x="36"  y="72"  width="6"  height="6"  fill="#f0e8c0"/>

  <!-- WING detail -->
  <rect x="60"  y="84"  width="24" height="24" fill="#ede0c0"/>
  <rect x="60"  y="84"  width="12" height="6"  fill="#f5ecd0"/>

  <!-- LEGS (orange) -->
  <rect x="72"  y="120" width="12" height="12" fill="#e07b00"/>
  <rect x="96"  y="120" width="12" height="12" fill="#e07b00"/>
  <rect x="72"  y="132" width="12" height="12" fill="#e07b00"/>
  <rect x="96"  y="132" width="12" height="12" fill="#e07b00"/>

  <!-- FEET (orange, 3 toes) -->
  <rect x="60"  y="144" width="12" height="12" fill="#e07b00"/>
  <rect x="72"  y="144" width="12" height="12" fill="#e07b00"/>
  <rect x="84"  y="144" width="12" height="12" fill="#e07b00"/>
  <rect x="84"  y="144" width="12" height="12" fill="#e07b00"/>
  <rect x="96"  y="144" width="12" height="12" fill="#e07b00"/>
  <rect x="108" y="144" width="12" height="12" fill="#e07b00"/>

</svg>